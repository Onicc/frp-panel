openapi: 3.1.0
info:
  title: frp-panel Master API
  version: 2.1.0
  description: |
    Resource-oriented API for one Master control plane. A Client is a physical
    host running the Client Agent, a Server is an FRPS data-plane host, and a
    Tunnel directly connects one Client to one Server. Internal FRPC
    connections are not user-managed resources.
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only
servers:
  - url: /api/v2
security:
  - cookieAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Master is ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, time, protocol]
                properties:
                  status: { const: ok }
                  time: { type: string, format: date-time }
                  protocol: { const: '2' }
  /bootstrap-status:
    get:
      operationId: getBootstrapStatus
      security: []
      responses:
        '200':
          description: First-run state used by the sign-in and Owner setup screens.
          content:
            application/json:
              schema:
                type: object
                required: [registrationEnabled, ownerExists, canCreateOwner]
                properties:
                  registrationEnabled: { type: boolean }
                  ownerExists: { type: boolean }
                  canCreateOwner: { type: boolean }
        '500': { $ref: '#/components/responses/Problem' }
  /agent/enroll:
    post:
      operationId: redeemClientEnrollment
      security: []
      description: Redeem a one-use Client enrollment token. The token is never stored in plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentRedeemRequest' }
      responses:
        '200':
          description: Long-lived Client Agent credential.
          headers: { Cache-Control: { schema: { const: no-store } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientEnrollmentResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /server/enroll:
    post:
      operationId: redeemServerEnrollment
      security: []
      description: Redeem a one-use Server enrollment token. The token is never stored in plaintext.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollmentRedeemRequest' }
      responses:
        '200':
          description: Long-lived FRPS credential.
          headers: { Cache-Control: { schema: { const: no-store } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerEnrollmentResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRequest' }
      responses:
        '200':
          description: Signed in; Master sets an HttpOnly session cookie.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/register:
    post:
      operationId: createOwner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AuthRequest'
                - type: object
                  required: [email]
                  properties:
                    email: { type: string, format: email }
      responses:
        '201':
          description: First Owner account created and signed in.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      operationId: signOut
      responses:
        '204': { description: Session cookie cleared. }
        '401': { $ref: '#/components/responses/Problem' }
  /account:
    get:
      operationId: getAccount
      responses:
        '200':
          description: Signed-in account profile.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
  /account/session:
    get:
      operationId: getSessionAccount
      responses:
        '200':
          description: Current session account.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Problem' }
  /account/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 12 }
      responses:
        '200':
          description: Password changed; the current session is invalidated.
          content:
            application/json:
              schema:
                type: object
                required: [reauthenticate]
                properties:
                  reauthenticate: { const: true }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /capabilities:
    get:
      operationId: getCapabilities
      responses:
        '200':
          description: Master and Client Agent capability metadata.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Problem' }
  /overview:
    get:
      operationId: getOverview
      responses:
        '200':
          description: Resource counts for the current tenant.
          content:
            application/json:
              schema:
                type: object
                required: [clients, servers, tunnels]
                properties:
                  clients: { type: integer, minimum: 0 }
                  servers: { type: integer, minimum: 0 }
                  tunnels: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Problem' }
  /clients:
    get:
      operationId: listClients
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Search' }
        - name: configurationState
          in: query
          schema: { type: string, enum: [configured, unconfigured] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ClientStatus' }
      responses:
        '200': { $ref: '#/components/responses/ClientPage' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientCreate' }
      responses:
        '201':
          description: Client created with a one-use enrollment payload.
          headers: { Cache-Control: { schema: { const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [client, enrollment]
                properties:
                  client: { $ref: '#/components/schemas/Client' }
                  enrollment: { $ref: '#/components/schemas/ClientEnrollment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{id}:
    parameters: [{ $ref: '#/components/parameters/ClientID' }]
    get:
      operationId: getClient
      responses:
        '200':
          description: Client resource.
          content:
            application/json:
              schema:
                type: object
                required: [client]
                properties: { client: { $ref: '#/components/schemas/Client' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateClient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientPatch' }
      responses:
        '200':
          description: Updated Client resource.
          content:
            application/json:
              schema:
                type: object
                required: [client]
                properties: { client: { $ref: '#/components/schemas/Client' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteClient
      responses:
        '204': { description: Client deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/{id}/enrollment:
    parameters: [{ $ref: '#/components/parameters/ClientID' }]
    post:
      operationId: rotateClientEnrollmentExplicit
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotationRequest' }
      responses:
        '200':
          description: New one-use enrollment payload.
          headers: { Cache-Control: { schema: { const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [client, enrollment]
                properties:
                  client: { $ref: '#/components/schemas/Client' }
                  enrollment: { $ref: '#/components/schemas/ClientEnrollment' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /servers:
    get:
      operationId: listServers
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Search' }
        - name: configurationState
          in: query
          schema: { type: string, enum: [configured, unconfigured] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ServerStatus' }
      responses:
        '200': { $ref: '#/components/responses/ServerPage' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createServer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerCreate' }
      responses:
        '201':
          description: Server created with a one-use enrollment and generated Compose file.
          headers: { Cache-Control: { schema: { const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [server, enrollment]
                properties:
                  server: { $ref: '#/components/schemas/Server' }
                  enrollment: { $ref: '#/components/schemas/ServerEnrollment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /servers/{id}:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    get:
      operationId: getServer
      responses:
        '200':
          description: Server resource.
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties: { server: { $ref: '#/components/schemas/Server' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateServer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServerPatch' }
      responses:
        '200':
          description: Updated Server resource.
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties: { server: { $ref: '#/components/schemas/Server' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteServer
      responses:
        '204': { description: Server deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /servers/{id}/enrollment:
    parameters: [{ $ref: '#/components/parameters/ServerID' }]
    post:
      operationId: rotateServerEnrollment
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotationRequest' }
      responses:
        '200':
          description: New one-use enrollment and generated Compose file.
          headers: { Cache-Control: { schema: { const: no-store } } }
          content:
            application/json:
              schema:
                type: object
                required: [server, enrollment]
                properties:
                  server: { $ref: '#/components/schemas/Server' }
                  enrollment: { $ref: '#/components/schemas/ServerEnrollment' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tunnels:
    get:
      operationId: listTunnels
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Search' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TunnelStatus' }
      responses:
        '200': { $ref: '#/components/responses/TunnelPage' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createTunnel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TunnelMutation' }
      responses:
        '201':
          description: Tunnel saved; its FRPC connection is reconciled asynchronously.
          content:
            application/json:
              schema:
                type: object
                required: [tunnel]
                properties: { tunnel: { $ref: '#/components/schemas/Tunnel' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tunnels/{id}:
    parameters: [{ $ref: '#/components/parameters/TunnelID' }]
    get:
      operationId: getTunnel
      responses:
        '200':
          description: Tunnel resource.
          content:
            application/json:
              schema:
                type: object
                required: [tunnel]
                properties: { tunnel: { $ref: '#/components/schemas/Tunnel' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateTunnel
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TunnelPatch' }
      responses:
        '200':
          description: Updated Tunnel resource.
          content:
            application/json:
              schema:
                type: object
                required: [tunnel]
                properties: { tunnel: { $ref: '#/components/schemas/Tunnel' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteTunnel
      responses:
        '204': { description: Tunnel deleted. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: frp-panel-cookie
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Search:
      name: search
      in: query
      schema: { type: string }
    ClientID:
      name: id
      in: path
      required: true
      schema: { type: string }
    ServerID:
      name: id
      in: path
      required: true
      schema: { type: string }
    TunnelID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 problem detail.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ClientPage:
      description: Paginated Client resources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientPage'
    ServerPage:
      description: Paginated Server resources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerPage'
    TunnelPage:
      description: Paginated Tunnel resources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TunnelPage'
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        password: { type: string, format: password, minLength: 12 }
    Account:
      type: object
      required: [username, email, role]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string }
    ClientCreate:
      type: object
      required: [clientId]
      properties:
        clientId: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        comment: { type: string, maxLength: 255 }
    ClientPatch:
      type: object
      minProperties: 1
      properties:
        comment: { type: string, maxLength: 255 }
        enabled: { type: boolean }
    Client:
      type: object
      required: [id, comment, configurationState, status, enabled, tunnelCount]
      properties:
        id: { type: string }
        comment: { type: string }
        configurationState: { type: string, enum: [configured, unconfigured] }
        status: { $ref: '#/components/schemas/ClientStatus' }
        enabled: { type: boolean }
        enrolledAt: { type: string, format: date-time, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        tunnelCount: { type: integer, minimum: 0 }
    ClientStatus:
      type: string
      enum: [pending, online, offline, error, disabled]
    ServerCreate:
      type: object
      required: [serverId, address]
      properties:
        serverId: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        address: { type: string, description: Public DNS name or IP without scheme or port. }
        bindPort: { type: integer, minimum: 1024, maximum: 65535, default: 7000 }
        serverApiPort: { type: integer, minimum: 1024, maximum: 65535, default: 8999, description: Loopback-only Server Agent authentication API port. Must differ from bindPort. }
        comment: { type: string, maxLength: 255 }
    ServerPatch:
      type: object
      minProperties: 1
      properties:
        address: { type: string }
        bindPort: { type: integer, minimum: 1024, maximum: 65535 }
        serverApiPort: { type: integer, minimum: 1024, maximum: 65535, description: Loopback-only Server Agent authentication API port. Must differ from bindPort. }
        comment: { type: string, maxLength: 255 }
    Server:
      type: object
      required: [id, address, bindPort, serverApiPort, comment, configurationState, status, tunnelCount]
      properties:
        id: { type: string }
        address: { type: string }
        bindPort: { type: integer }
        serverApiPort: { type: integer }
        comment: { type: string }
        configurationState: { type: string, enum: [configured, unconfigured] }
        status: { $ref: '#/components/schemas/ServerStatus' }
        enrolledAt: { type: string, format: date-time, nullable: true }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        tunnelCount: { type: integer, minimum: 0 }
    ServerStatus:
      type: string
      enum: [pending, online, offline]
    ClientEnrollment:
      type: object
      required: [clientId, token, expiresAt, apiUrl, rpcUrl, installCommands]
      properties:
        clientId: { type: string }
        token: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
        apiUrl: { type: string, format: uri }
        rpcUrl: { type: string, format: uri }
        installCommands:
          type: object
          required: [linux, darwin, windows]
          properties:
            linux: { type: string }
            darwin: { type: string }
            windows: { type: string }
    EnrollmentRedeemRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32, maxLength: 256, writeOnly: true }
    ClientEnrollmentResult:
      type: object
      required: [clientId, secret]
      properties:
        clientId: { type: string }
        secret: { type: string, writeOnly: true }
    ServerEnrollmentResult:
      type: object
      required: [serverId, secret]
      properties:
        serverId: { type: string }
        secret: { type: string, writeOnly: true }
    ServerEnrollment:
      type: object
      required: [serverId, token, expiresAt, apiUrl, rpcUrl, composeYaml]
      properties:
        serverId: { type: string }
        token: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
        apiUrl: { type: string, format: uri }
        rpcUrl: { type: string, format: uri }
        composeYaml: { type: string }
    RotationRequest:
      type: object
      properties:
        acknowledgeDisruption: { type: boolean, default: false }
    TunnelMutation:
      type: object
      required: [name, clientId, serverId, type, localPort, remotePort]
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        clientId: { type: string }
        serverId: { type: string }
        type: { type: string, enum: [tcp, udp] }
        localHost: { type: string, default: 127.0.0.1 }
        localPort: { type: integer, minimum: 1, maximum: 65535 }
        remotePort: { type: integer, minimum: 1024, maximum: 65535, description: Must be unique per Server and protocol among enabled Tunnels. }
        enabled: { type: boolean, default: true }
    TunnelPatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, pattern: '^[A-Za-z0-9_-]+$' }
        clientId: { type: string }
        serverId: { type: string }
        type: { type: string, enum: [tcp, udp] }
        localHost: { type: string }
        localPort: { type: integer, minimum: 1, maximum: 65535 }
        remotePort: { type: integer, minimum: 1024, maximum: 65535 }
        enabled: { type: boolean }
    Tunnel:
      type: object
      required: [id, name, clientId, serverId, type, localHost, localPort, remotePort, enabled, status, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        clientId: { type: string }
        serverId: { type: string }
        type: { type: string, enum: [tcp, udp] }
        localHost: { type: string }
        localPort: { type: integer }
        remotePort: { type: integer }
        enabled: { type: boolean }
        status: { $ref: '#/components/schemas/TunnelStatus' }
        lastError: { type: string }
        updatedAt: { type: string, format: date-time }
    TunnelStatus:
      type: string
      enum: [pending, online, offline, error, disabled]
    Page:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    ClientPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Client' }
    ServerPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Server' }
    TunnelPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Tunnel' }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
