name: Recover Stable Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable vX.X.X tag to finish publishing
        required: true
        type: string
      promote_only:
        description: Verify and publish an already-built draft without rebuilding assets
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-recovery-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify tag, passed CI, and published versioned images
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$(jq -r .version www/package.json)"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          commit=$(git rev-parse HEAD)
          gh run list --repo Onicc/frp-panel --workflow CI --commit "$commit" --limit 20 --json conclusion |
            jq -e 'any(.[]; .conclusion == "success")' >/dev/null
          for image in onicc/frp-panel onicc/frp-panel-agent; do
            docker buildx imagetools inspect "$image:$RELEASE_TAG" | grep -Fq 'linux/amd64'
            docker buildx imagetools inspect "$image:$RELEASE_TAG" | grep -Fq 'linux/arm64'
          done
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ !inputs.promote_only }}
        with: { version: 10.17.1 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ !inputs.promote_only }}
        with: { node-version: 24, cache: pnpm, cache-dependency-path: www/pnpm-lock.yaml }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ !inputs.promote_only }}
        with: { go-version-file: go.mod, cache: true }
      - id: syft
        if: ${{ !inputs.promote_only }}
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { syft-version: v1.51.1 }
      - name: Build and check embedded web console
        if: ${{ !inputs.promote_only }}
        run: |
          set -euo pipefail
          (cd www && pnpm install --frozen-lockfile && pnpm build)
          git diff --exit-code --ignore-space-at-eol -- cmd/frpp/out
          test -z "$(git ls-files --others --exclude-standard cmd/frpp/out)"
          git restore -- cmd/frpp/out
          test -z "$(git status --porcelain)"
      - name: Stage tagged binaries in a draft release
        if: ${{ !inputs.promote_only }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.release_tag }}
      - name: Assemble and attest release assets
        if: ${{ !inputs.promote_only }}
        run: |
          set -euo pipefail
          mkdir -p dist/upload
          jq -r '.[] | select(.extra.ID? == "binaries" or .type == "SBOM" or .type == "Checksum") | [.path, .name] | @tsv' dist/artifacts.json |
            while IFS=$'\t' read -r source name; do cp "$source" "dist/upload/$name"; done
          test "$(find dist/upload -type f | wc -l)" -ge 17
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        if: ${{ !inputs.promote_only }}
        with:
          subject-path: dist/upload/*
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify release assets and both image versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo Onicc/frp-panel --json isDraft,assets --jq '.isDraft and (.assets | length >= 17)' | grep -Fxq true
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo Onicc/frp-panel --dir release-assets
          (cd release-assets && sha256sum -c checksums.txt)
          chmod +x release-assets/frp-panel-linux-amd64 release-assets/frp-panel-agent-linux-amd64
          for binary in frp-panel-linux-amd64 frp-panel-agent-linux-amd64; do
            release-assets/$binary version | grep -Fx "BinVersion: $RELEASE_TAG"
            release-assets/$binary version | grep -Fx "GitCommit: $RELEASE_COMMIT"
          done
          docker run --rm --entrypoint /usr/local/bin/frp-panel "onicc/frp-panel:$RELEASE_TAG" version | grep -Fx "BinVersion: $RELEASE_TAG"
          docker run --rm "onicc/frp-panel-agent:$RELEASE_TAG" version | grep -Fx "BinVersion: $RELEASE_TAG"
      - name: Promote latest aliases and publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          for image in onicc/frp-panel onicc/frp-panel-agent; do
            docker buildx imagetools create --tag "$image:latest" "$image:$RELEASE_TAG"
          done
          gh release edit "$RELEASE_TAG" --repo Onicc/frp-panel --draft=false --latest
