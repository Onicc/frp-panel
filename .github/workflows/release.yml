name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm, cache-dependency-path: www/pnpm-lock.yaml }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: go.mod, cache: true }
      - working-directory: www
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          pnpm audit --prod --audit-level high
          pnpm build
      - name: Go quality gates
        run: |
          go test ./...
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude-generated -exclude=G104,G115,G204,G301,G302,G304,G122 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  binaries:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.17.1 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm, cache-dependency-path: www/pnpm-lock.yaml }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: go.mod, cache: true }
      - id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { syft-version: v1.51.1 }
      - name: Build web console
        working-directory: www
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build rolling edge binaries
        if: github.ref == 'refs/heads/main'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tagged binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble named release assets
        run: |
          set -euo pipefail
          mkdir -p dist/upload
          jq -r '.[] | select(.extra.ID? == "binaries" or .type == "SBOM" or .type == "Checksum") | [.path, .name] | @tsv' dist/artifacts.json |
            while IFS=$'\t' read -r source name; do
              cp "$source" "dist/upload/$name"
            done
          test "$(find dist/upload -type f | wc -l)" -ge 17
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/upload/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-binaries
          path: dist/upload/*
      - name: Publish rolling edge release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete edge --yes --cleanup-tag || true
          gh release create edge --target "$GITHUB_SHA" dist/upload/* \
            --prerelease --title "edge" --notes "Automated build from main at $GITHUB_SHA"

  images:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - target: master
            image: onicc/frp-panel
          - target: agent
            image: onicc/frp-panel-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          tags: |
            ${{ matrix.image }}:${{ github.ref == 'refs/heads/main' && 'edge' || github.ref_name }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:latest', matrix.image) || '' }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: index.docker.io/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
