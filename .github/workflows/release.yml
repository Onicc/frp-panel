name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify immutable release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$(jq -r .version www/package.json)"
          grep -Fq "onicc/frp-panel:$RELEASE_TAG" compose.yaml
          grep -Fq "onicc/frp-panel:$RELEASE_TAG" docs/deployment.md
          grep -Fq "onicc/frp-panel:$RELEASE_TAG" docs/en/deployment.md
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.17.1 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm, cache-dependency-path: www/pnpm-lock.yaml }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: go.mod, cache: true }
      - working-directory: www
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          pnpm audit --prod --audit-level high
          pnpm build
      - name: Documentation build
        working-directory: docs
        run: pnpm install --frozen-lockfile && pnpm docs:build
      - name: Go quality gates
        run: |
          go test -race ./...
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude-generated -exclude=G104,G115,G204,G301,G302,G304,G122 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
          test -z "$(gofmt -l -- .)"

  binaries:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10.17.1 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: pnpm, cache-dependency-path: www/pnpm-lock.yaml }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version-file: go.mod, cache: true }
      - id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with: { syft-version: v1.51.1 }
      - name: Build web console
        working-directory: www
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Stage tagged binaries in a draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble named release assets
        run: |
          set -euo pipefail
          mkdir -p dist/upload
          jq -r '.[] | select(.extra.ID? == "binaries" or .type == "SBOM" or .type == "Checksum") | [.path, .name] | @tsv' dist/artifacts.json |
            while IFS=$'\t' read -r source name; do
              cp "$source" "dist/upload/$name"
            done
          test "$(find dist/upload -type f | wc -l)" -ge 17
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/upload/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-binaries
          path: dist/upload/*
  images:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - target: master
            image: onicc/frp-panel
          - target: agent
            image: onicc/frp-panel-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          tags: |
            ${{ matrix.image }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: index.docker.io/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [binaries, images]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify release assets and matching multi-platform images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/Onicc/frp-panel/releases/tags/$RELEASE_TAG" --jq '.draft and (.assets | length >= 17)' | grep -Fxq true
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo Onicc/frp-panel --dir release-assets
          (cd release-assets && sha256sum -c checksums.txt)
          chmod +x release-assets/frp-panel-linux-amd64 release-assets/frp-panel-agent-linux-amd64
          release-assets/frp-panel-linux-amd64 version | grep -Fx "BinVersion: $RELEASE_TAG"
          release-assets/frp-panel-agent-linux-amd64 version | grep -Fx "BinVersion: $RELEASE_TAG"
          for image in onicc/frp-panel onicc/frp-panel-agent; do
            docker buildx imagetools inspect "$image:$RELEASE_TAG" | grep -Fq 'linux/amd64'
            docker buildx imagetools inspect "$image:$RELEASE_TAG" | grep -Fq 'linux/arm64'
          done
          docker run --rm --entrypoint /usr/local/bin/frp-panel "onicc/frp-panel:$RELEASE_TAG" version | grep -Fx "BinVersion: $RELEASE_TAG"
          docker run --rm "onicc/frp-panel-agent:$RELEASE_TAG" version | grep -Fx "BinVersion: $RELEASE_TAG"
      - name: Promote verified stable images and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for image in onicc/frp-panel onicc/frp-panel-agent; do
            docker buildx imagetools create --tag "$image:latest" "$image:$RELEASE_TAG"
          done
          gh release edit "$RELEASE_TAG" --repo Onicc/frp-panel --draft=false --latest
